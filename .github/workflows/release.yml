# Release workflow: runs when a version tag (v*) is pushed.
# Trains + evaluates -> builds the Docker image -> container smoke tests
# -> pushes to GHCR -> publishes a GitHub Release with metrics.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

env:
  PYTHON_VERSION: "3.12"

jobs:
  release:
    name: Train, build, smoke test & publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train model & evaluate metrics
        env:
          MODEL_VERSION: ${{ github.ref_name }}
        run: python train.py

      - name: Compute image name (GHCR requires lowercase)
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (with baked-in model)
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: MODEL_VERSION=${{ github.ref_name }}
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}
          load: true

      - name: Container smoke test
        run: |
          set -euo pipefail
          docker run -d --name smoke -p 80:80 "${IMAGE}:${GITHUB_REF_NAME}"

          # Wait for the service to come up.
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:80/health > /dev/null 2>&1; then break; fi
            sleep 1
          done

          echo "== /health =="
          curl -fsS http://localhost:80/health | tee /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json
          grep -q "\"model_version\":\"${GITHUB_REF_NAME}\"" /tmp/health.json

          echo "== /predict (valid) =="
          curl -fsS -X POST http://localhost:80/predict \
            -H "Content-Type: application/json" \
            -d '{"age": 0.02, "sex": -0.044, "bmi": 0.06, "bp": -0.03, "s1": -0.02, "s2": 0.03, "s3": -0.02, "s4": 0.02, "s5": 0.02, "s6": -0.001}' \
            | tee /tmp/predict.json
          grep -q '"prediction"' /tmp/predict.json

          echo "== /predict (invalid: s6 missing) must be 422 =="
          STATUS=$(curl -s -o /tmp/error.json -w "%{http_code}" -X POST http://localhost:80/predict \
            -H "Content-Type: application/json" \
            -d '{"age": 0.02, "sex": -0.044, "bmi": 0.06, "bp": -0.03, "s1": -0.02, "s2": 0.03, "s3": -0.02, "s4": 0.02, "s5": 0.02}')
          echo "status: $STATUS"; cat /tmp/error.json
          test "$STATUS" = "422"
          grep -q 's6' /tmp/error.json

          docker rm -f smoke

      - name: Push image to GHCR
        run: docker push "${IMAGE}:${GITHUB_REF_NAME}"

      - name: Extract changelog section for this release
        run: |
          awk -v ver="${GITHUB_REF_NAME}" '
            $0 ~ "^## ?"ver {found=1; next}
            found && /^## / {exit}
            found {print}
          ' CHANGELOG.md > release_body.md || true
          if [ ! -s release_body.md ]; then
            echo "See CHANGELOG.md for details." > release_body.md
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_body.md
          files: |
            metrics/metrics.json
